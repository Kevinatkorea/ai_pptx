<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Proposal Factory{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
           margin: 0; padding: 0; color: #222; background: #f6f7f9; line-height: 1.5; }
    header { background: #1a3d46; color: white; padding: 14px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header a { color: #cfeaf0; text-decoration: none; }
    header a:hover { color: white; }
    main { max-width: 1024px; margin: 24px auto; padding: 0 24px; }
    h2 { margin-top: 0; }
    h3 { margin-top: 0; font-size: 16px; }
    .card { background: white; border: 1px solid #e0e3e7; border-radius: 8px; padding: 18px 20px; margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    .status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status-ready_for_review { background: #fff3cd; color: #856404; }
    .status-needs_human_approval { background: #f8d7da; color: #721c24; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-output_done { background: #c8e7d8; color: #0f4023; }
    .status-new_type_queued { background: #d1ecf1; color: #0c5460; }
    .status-recipe_promoted { background: #e0d4f7; color: #4a2c80; }
    .status-autofix_then_recheck { background: #fde2c4; color: #783f04; }
    .status-unknown { background: #e2e3e5; color: #383d41; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eef0f2; vertical-align: top; }
    th { background: #f8f9fa; font-size: 13px; font-weight: 600; color: #4a4f55; }
    .findings .fail { color: #c0392b; font-weight: 600; }
    .findings .warn { color: #d68910; font-weight: 600; }
    button, .btn { background: #1a3d46; color: white; border: 0; padding: 9px 18px; border-radius: 5px;
                   cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; font-family: inherit; }
    button:hover, .btn:hover { background: #245460; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #5a6268; }
    .preview-box { background: #f0f2f5; padding: 32px; text-align: center; color: #888; border-radius: 6px; }
    .preview-box img { max-width: 100%; height: auto; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .empty { text-align: center; color: #888; padding: 60px 20px; font-size: 15px; }
    code { background: #eef0f2; padding: 2px 7px; border-radius: 3px; font-size: 12px; font-family: SF Mono, Menlo, monospace; }
    .muted { color: #888; font-size: 13px; }
    pre.code-block { background: #1e2a2e; color: #e6edf0; padding: 14px 16px; border-radius: 6px;
                     overflow-x: auto; font-size: 12px; line-height: 1.45;
                     font-family: SF Mono, Menlo, monospace; margin: 8px 0; }
    .ops-list { margin: 6px 0; padding-left: 20px; font-size: 14px; }
    .ops-list code { font-size: 12px; }
    .badge-ai { display: inline-block; background: #6f42c1; color: white; padding: 1px 8px;
                border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .nav-back { display: inline-block; margin-bottom: 12px; color: #1a3d46; text-decoration: none; }
    .nav-back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header><h1><a href="/">📋 Proposal Factory — 검수 UI</a></h1></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
